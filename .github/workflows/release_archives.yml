name: Release Archives

on:
  push:
    tags:
      - 'v*'

env:
  # TRUE = Download SFX module from mcmilk/7-Zip-zstd
  # FALSE = Download Windows 7-Zip
  USE_MODDED_SFX: true
  SEVENZIP_ZSTD: "Installer_7z-zstd-x64"
  SEVENZIP_EXE: "7z2501-x64.exe"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Calculate Statistics
        id: stats
        run: |
          git config --global --add safe.directory '*'
          git config --global core.quotePath false
          git fetch --tags --force

          CURRENT_TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^$CURRENT_TAG$" | head -n 1)
          if [ -z "$PREV_TAG" ]; then PREV_TAG="NONE"; fi

          echo "Current Tag: $CURRENT_TAG"
          echo "Previous Tag found: $PREV_TAG"

          DIR_MULTI="Multi-Sheet Songs"
          DIR_SONGS="Songs"

          count_total() {
            find "$1" -type f -not -name ".gitkeep" -not -name ".keep" 2>/dev/null | wc -l
          }

          TOTAL_MULTI=$(count_total "$DIR_MULTI")
          TOTAL_SONGS=$(count_total "$DIR_SONGS")

          echo "STATS_TOTAL_MULTI=$TOTAL_MULTI" >> $GITHUB_ENV
          echo "STATS_TOTAL_SONGS=$TOTAL_SONGS" >> $GITHUB_ENV
          echo "PREV_TAG_NAME=$PREV_TAG" >> $GITHUB_ENV
          echo "CURRENT_TAG_NAME=$CURRENT_TAG" >> $GITHUB_ENV

          if [ "$PREV_TAG" != "NONE" ]; then
            echo "COMPARE_URL=https://github.com/$REPO/compare/$PREV_TAG...$CURRENT_TAG" >> $GITHUB_ENV
          fi

          format_count() {
            if [ "$1" == "0" ]; then echo "-"; else echo "$1"; fi
          }

          calculate_diff_stats() {
            local DIR=$1
            local P_TAG=$2
            local VAR_PREFIX=$3

            if [ "$P_TAG" == "NONE" ]; then
              local TOTAL=$(count_total "$DIR")
              echo "${VAR_PREFIX}_A=$TOTAL" >> $GITHUB_ENV
              echo "${VAR_PREFIX}_M=-" >> $GITHUB_ENV
              echo "${VAR_PREFIX}_D=-" >> $GITHUB_ENV
              echo "${VAR_PREFIX}_R=-" >> $GITHUB_ENV
              echo "${VAR_PREFIX}_MV=-" >> $GITHUB_ENV
              return
            fi

            echo "----------------------------------------------------------------------"
            echo "🔎 Analyzing changes for: $DIR"
            echo "📝 Command: git diff --name-status -M $P_TAG HEAD -- \"$DIR\""

            CHANGES=$(git diff --name-status -M "$P_TAG" HEAD -- "$DIR")

            if [ -z "$CHANGES" ]; then
                echo "   (No changes found)"
            else
                echo "$CHANGES"
            fi
            echo "----------------------------------------------------------------------"

            CNT_A=$(echo "$CHANGES" | grep "^A" | wc -l)
            CNT_M=$(echo "$CHANGES" | grep "^M" | wc -l)
            CNT_D=$(echo "$CHANGES" | grep "^D" | wc -l)

            R_STATS=$(echo "$CHANGES" | grep "^R" | awk -F'\t' '{
              old=$2; new=$3;

              sub(/[^\/]+$/, "", old);
              sub(/[^\/]+$/, "", new);
              if (old == new) print "REN"; else print "MOV";
            }')

            CNT_R=$(echo "$R_STATS" | grep "REN" | wc -l)
            CNT_MV=$(echo "$R_STATS" | grep "MOV" | wc -l)

            echo "${VAR_PREFIX}_A=$(format_count $CNT_A)" >> $GITHUB_ENV
            echo "${VAR_PREFIX}_M=$(format_count $CNT_M)" >> $GITHUB_ENV
            echo "${VAR_PREFIX}_D=$(format_count $CNT_D)" >> $GITHUB_ENV
            echo "${VAR_PREFIX}_R=$(format_count $CNT_R)" >> $GITHUB_ENV
            echo "${VAR_PREFIX}_MV=$(format_count $CNT_MV)" >> $GITHUB_ENV
          }

          calculate_diff_stats "$DIR_MULTI" "$PREV_TAG" "MULTI"
          calculate_diff_stats "$DIR_SONGS" "$PREV_TAG" "SONGS"

      - name: Install 7-Zip & Utils
        run: sudo apt-get update && sudo apt-get install -y p7zip-full wget jq curl

      - name: Download Windows SFX Module
        run: |
          if [ "${{ env.USE_MODDED_SFX }}" == "true" ]; then
            echo "🔹 Mode: Downloading Modded SFX (mcmilk)"

            RESPONSE=$(curl -sL https://api.github.com/repos/mcmilk/7-Zip-zstd/releases/latest)
            DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name | test("^7z.*-x64\\.exe$")) | .browser_download_url')
            if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
              echo "Failed to find installer EXE in release assets."
              echo "Response content: $RESPONSE"
              exit 1
            fi

            echo "Found ${{ env.SEVENZIP_ZSTD }} URL: $DOWNLOAD_URL"
            wget -O ${{ env.SEVENZIP_ZSTD }}.exe "$DOWNLOAD_URL"
            7z e ${{ env.SEVENZIP_ZSTD }}.exe 7z.sfx -r
          else
            echo "🔸 Mode: Downloading Windows 7-Zip SFX"

            wget "https://www.7-zip.org/a/${{ env.SEVENZIP_EXE }}"
            7z e "${{ env.SEVENZIP_EXE }}" 7z.sfx
          fi

      - name: Archive Folders
        run: |
          CURRENT_DATE=$(date +%Y-%m-%d)

          FILE_FULL="Sky1984-Sheets-Collection-${CURRENT_DATE}"
          FILE_MULTI_SHEET="Sky1984-Collection-Multi_Sheet_Songs-${CURRENT_DATE}.7z"
          FILE_SONGS="Sky1984-Collection-Songs-${CURRENT_DATE}.7z"

          # LZMA2_PARAMS="-m0=lzma2:d=64m:fb=128 -ms=512m -mmt=on -bb0 -bsp0"
          PPMD_PARAMS="-m0=PPMd:mem=96m:o=8 -ms=512m -mmt=on -bb0 -bsp0"

          7z a $PPMD_PARAMS -sfx./7z.sfx "${FILE_FULL}_x64.exe" . -xr!.git -xr!.github -xr!*.7z -xr!*.exe -xr!*.sfx

          7z a $PPMD_PARAMS -t7z "$FILE_FULL.7z" . -xr!.git -xr!.github -xr!*.7z -xr!*.exe -xr!*.sfx
          7z a $PPMD_PARAMS -t7z "$FILE_MULTI_SHEET" "Multi-Sheet Songs"
          7z a $PPMD_PARAMS -t7z "$FILE_SONGS" "Songs"

          rm -f 7z.sfx
          rm -f "${{ env.SEVENZIP_ZSTD }}.exe"
          rm -f "${{ env.SEVENZIP_EXE }}"

      - name: VirusTotal Scan
        id: vt_scan
        uses: crazy-max/ghaction-virustotal@v4.2.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          github_token: ${{ secrets.STUB_TOKEN || secrets.GITHUB_TOKEN }}
          files: |
            Sky1984*.exe
            Sky1984*.7z

      - name: Generate Release Body
        id: gen_body
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VT_RESULTS: ${{ steps.vt_scan.outputs.analysis }}
        run: |
          TAG_RAW=${{ github.ref_name }}
          TAG_CLEAN=${TAG_RAW#v}
          TAG_FORMATTED=${TAG_CLEAN/-/ - }

          RELEASE_TITLE="Sky1984 Sheets Collection Release - ${TAG_FORMATTED}"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

          REPO_URL="https://github.com/${{ github.repository }}"
          DATE_NOW=$(date +'%Y-%m-%d')

          BODY_HEADER="### Sky1984 Sheets Collection Release - [${TAG_RAW}]($REPO_URL/tree/${TAG_RAW}) (${DATE_NOW})"
          echo "$BODY_HEADER" > release_body.md

          echo "" >> release_body.md

          echo "### 📊 Statistics" >> release_body.md

          echo "" >> release_body.md

          echo "| Category | Total | ➕ Added | 📝 Modified | 🗑️ Deleted | 🏷️ Renamed | 🚚 Moved |" >> release_body.md
          echo "| :--- | :---: | :---: | :---: | :---: | :---: | :---: |" >> release_body.md
          echo "| **Multi-Sheet** | ${{ env.STATS_TOTAL_MULTI }} | ${{ env.MULTI_A }} | ${{ env.MULTI_M }} | ${{ env.MULTI_D }} | ${{ env.MULTI_R }} | ${{ env.MULTI_MV }} |" >> release_body.md
          echo "| **Songs** | ${{ env.STATS_TOTAL_SONGS }} | ${{ env.SONGS_A }} | ${{ env.SONGS_M }} | ${{ env.SONGS_D }} | ${{ env.SONGS_R }} | ${{ env.SONGS_MV }} |" >> release_body.md

          echo "" >> release_body.md

          if [ "${{ env.PREV_TAG_NAME }}" == "NONE" ]; then
            echo "First Release" >> release_body.md
          else
            printf "🔄 **View Full Changelog:** [\`%s...%s\`](%s)\n" \
              "${{ env.PREV_TAG_NAME }}" \
              "${{ env.CURRENT_TAG_NAME }}" \
              "${{ env.COMPARE_URL }}" >> release_body.md
          fi

          echo "<details>" >> release_body.md
          echo "<summary>🛡️ VirusTotal GitHub Action analysis:</summary>" >> release_body.md
          echo "" >> release_body.md
          echo "$VT_RESULTS" | tr ',' '\n' | sed 's/^\([^=]*\)=\(.*\)/- [\1](\2)/' >> release_body.md
          echo "" >> release_body.md
          echo "</details>" >> release_body.md

          echo "Generated Release Content:"
          cat release_body.md

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v3.1.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: |
            Sky1984*.exe
            Sky1984*.7z

      - name: GH Release
        uses: softprops/action-gh-release@v2.5.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ env.RELEASE_TITLE }}
          files: |
            Sky1984*.exe
            Sky1984*.7z
          body_path: release_body.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
